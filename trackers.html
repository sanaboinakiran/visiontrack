<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vision Track — Project Trackers</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="rail">
    <div class="rail-header">
      <div class="wordmark"><span class="dot"></span> Vision Track</div>
    </div>
    <div style="padding: 10px 8px 0;">
      <a href="dashboard.html" class="rail-item"><span>Dashboard</span></a>
      <a href="mytasks.html" class="rail-item"><span>My Tasks</span></a>
      <a href="todo.html" class="rail-item"><span>Daily To-Do</span></a>
      <a href="projects.html" class="rail-item"><span>Projects</span></a>
      <a href="trackers.html" class="rail-item active"><span>Project Trackers</span></a>
      <a href="sites.html" class="rail-item"><span>Sites</span></a>
      <a href="calendar.html" class="rail-item"><span>Calendar</span></a>
      <a href="reports.html" class="rail-item"><span>Reports</span></a>
    </div>
    <div style="padding: 14px 16px 4px; font-size:12px; color: var(--text-faint);">Workspace</div>
    <div class="rail-projects" id="project-list"></div>
    <div style="padding: 10px 16px;">
      <a href="dashboard.html?new=project" style="display:block;"><button style="width:100%;">+ New project</button></a>
    </div>
    <div class="rail-footer">
      <span id="user-email" style="font-family: var(--mono); font-size:12px; color: var(--text-faint);"></span>
      <button class="ghost" id="signout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-wrap">
      <div class="page-header">
        <div>
          <h1>Project Trackers</h1>
          <p>CCTV camera installs — status and location for every unit.</p>
        </div>
        <button class="primary" id="new-camera-btn">+ New camera</button>
      </div>

      <table class="data-table">
        <thead>
          <tr><th>Camera</th><th>Site</th><th>Project</th><th>Status</th><th>IP address</th><th>Installed</th></tr>
        </thead>
        <tbody id="camera-rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-backdrop hidden" id="camera-modal-backdrop">
  <div class="modal">
    <h3 id="camera-modal-title">New camera</h3>
    <div class="auth-error" id="camera-error"></div>
    <div class="field"><label for="camera-name">Name / unit ID</label><input id="camera-name" type="text" placeholder="e.g. CAM-014" /></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field"><label for="camera-site">Site</label><select id="camera-site"></select></div>
      <div class="field"><label for="camera-project">Project</label><select id="camera-project"></select></div>
    </div>
    <div class="field"><label for="camera-location">Location detail</label><input id="camera-location" type="text" placeholder="e.g. North gate, pole 3" /></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field"><label for="camera-status">Status</label>
        <select id="camera-status">
          <option value="planned">Planned</option>
          <option value="installed">Installed</option>
          <option value="faulty">Faulty</option>
          <option value="removed">Removed</option>
        </select>
      </div>
      <div class="field"><label for="camera-ip">IP address</label><input id="camera-ip" type="text" placeholder="192.168.1.14" /></div>
    </div>
    <div class="field"><label for="camera-date">Installed date</label><input id="camera-date" type="date" /></div>
    <div class="field"><label for="camera-notes">Notes</label><textarea id="camera-notes"></textarea></div>
    <div class="modal-actions">
      <button class="danger ghost hidden" id="camera-delete-btn">Delete</button>
      <div class="right">
        <button class="ghost" id="camera-cancel-btn">Cancel</button>
        <button class="primary" id="camera-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="client.js"></script>
<script src="shell.js"></script>
<script>
(async function () {
  const user = await window.requireUser();
  if (!user) return;
  await initShell(user);

  let cameras = [], sites = [], projects = [];
  let editingId = null;

  async function loadAll() {
    const [c, s, p] = await Promise.all([
      window.sb.from("cameras").select("*").order("created_at", { ascending: false }),
      window.sb.from("sites").select("id, name").order("name"),
      window.sb.from("projects").select("id, name").order("name"),
    ]);
    cameras = c.data || [];
    sites = s.data || [];
    projects = p.data || [];
    populateSelects();
    render();
  }

  function populateSelects() {
    const siteSel = document.getElementById("camera-site");
    const projSel = document.getElementById("camera-project");
    siteSel.innerHTML = '<option value="">—</option>' + sites.map((s) => `<option value="${s.id}">${window.escapeHtmlShared(s.name)}</option>`).join("");
    projSel.innerHTML = '<option value="">—</option>' + projects.map((p) => `<option value="${p.id}">${window.escapeHtmlShared(p.name)}</option>`).join("");
  }

  function render() {
    const body = document.getElementById("camera-rows");
    body.innerHTML = "";
    if (!cameras.length) {
      body.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-faint);">No cameras logged yet.</td></tr>';
      return;
    }
    cameras.forEach((c) => {
      const site = sites.find((s) => s.id === c.site_id);
      const project = projects.find((p) => p.id === c.project_id);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${window.escapeHtmlShared(c.name)}</td>
        <td>${site ? window.escapeHtmlShared(site.name) : "—"}</td>
        <td>${project ? window.escapeHtmlShared(project.name) : "—"}</td>
        <td><span class="status-tag ${c.status}">${c.status}</span></td>
        <td>${c.ip_address ? window.escapeHtmlShared(c.ip_address) : "—"}</td>
        <td>${c.installed_date || "—"}</td>
      `;
      tr.addEventListener("click", () => openModal(c.id));
      body.appendChild(tr);
    });
  }

  function openModal(id) {
    editingId = id;
    document.getElementById("camera-error").style.display = "none";
    const del = document.getElementById("camera-delete-btn");
    if (id) {
      const c = cameras.find((x) => x.id === id);
      document.getElementById("camera-modal-title").textContent = "Edit camera";
      document.getElementById("camera-name").value = c.name;
      document.getElementById("camera-site").value = c.site_id || "";
      document.getElementById("camera-project").value = c.project_id || "";
      document.getElementById("camera-location").value = c.location || "";
      document.getElementById("camera-status").value = c.status;
      document.getElementById("camera-ip").value = c.ip_address || "";
      document.getElementById("camera-date").value = c.installed_date || "";
      document.getElementById("camera-notes").value = c.notes || "";
      del.classList.remove("hidden");
    } else {
      document.getElementById("camera-modal-title").textContent = "New camera";
      ["camera-name","camera-location","camera-ip","camera-date","camera-notes"].forEach((id2) => document.getElementById(id2).value = "");
      document.getElementById("camera-site").value = "";
      document.getElementById("camera-project").value = "";
      document.getElementById("camera-status").value = "planned";
      del.classList.add("hidden");
    }
    document.getElementById("camera-modal-backdrop").classList.remove("hidden");
  }
  function closeModal() {
    document.getElementById("camera-modal-backdrop").classList.add("hidden");
  }

  document.getElementById("new-camera-btn").addEventListener("click", () => openModal(null));
  document.getElementById("camera-cancel-btn").addEventListener("click", closeModal);

  document.getElementById("camera-save-btn").addEventListener("click", async () => {
    const name = document.getElementById("camera-name").value.trim();
    const errBox = document.getElementById("camera-error");
    if (!name) { errBox.textContent = "Give the camera a name or unit ID."; errBox.style.display = "block"; return; }
    const payload = {
      name,
      site_id: document.getElementById("camera-site").value || null,
      project_id: document.getElementById("camera-project").value || null,
      location: document.getElementById("camera-location").value.trim(),
      status: document.getElementById("camera-status").value,
      ip_address: document.getElementById("camera-ip").value.trim(),
      installed_date: document.getElementById("camera-date").value || null,
      notes: document.getElementById("camera-notes").value.trim(),
    };
    let error;
    if (editingId) {
      ({ error } = await window.sb.from("cameras").update(payload).eq("id", editingId));
    } else {
      ({ error } = await window.sb.from("cameras").insert({ ...payload, owner_id: user.id }));
    }
    if (error) { errBox.textContent = error.message; errBox.style.display = "block"; return; }
    closeModal();
    await loadAll();
  });

  document.getElementById("camera-delete-btn").addEventListener("click", async () => {
    if (!editingId || !confirm("Delete this camera record?")) return;
    await window.sb.from("cameras").delete().eq("id", editingId);
    closeModal();
    await loadAll();
  });

  await loadAll();
})();
</script>
</body>
</html>
