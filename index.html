<style>:root {
  --bg: #0f1417;
  --panel: #171d21;
  --panel-raised: #1c2327;
  --hairline: #2a3237;
  --text: #e8edef;
  --text-dim: #8b979d;
  --text-faint: #5b656a;
  --accent: #4fd1c5;
  --accent-dim: #2c5c57;
  --success: #5fbf77;
  --warning: #e8b84b;
  --danger: #e2685b;
  --radius: 6px;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

:root[data-theme="light"] {
  --bg: #f6f8f9;
  --panel: #ffffff;
  --panel-raised: #eef1f2;
  --hairline: #dde3e6;
  --text: #1b2226;
  --text-dim: #5b666c;
  --text-faint: #8b979d;
  --accent: #0e8e82;
  --accent-dim: #bfe9e4;
  --success: #2f9e52;
  --warning: #a86a00;
  --danger: #c1392b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  height: 100%;
}

a { color: inherit; }

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  color: var(--text);
  border-radius: var(--radius);
  padding: 8px 14px;
  transition: border-color 0.15s ease;
}
button:hover { border-color: var(--text-dim); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

button.primary {
  background: var(--accent);
  color: #0a1413;
  border-color: var(--accent);
  font-weight: 600;
}
button.primary:hover { border-color: var(--accent); filter: brightness(1.08); }

button.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-dim);
}
button.ghost:hover { color: var(--text); border-color: var(--hairline); }

button.danger { color: var(--danger); }

input, textarea, select {
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 9px 11px;
  width: 100%;
}
textarea { resize: vertical; min-height: 70px; }

label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.field { margin-bottom: 16px; }

/* ── Auth screen ─────────────────────────────────────────────────── */
.auth-wrap {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  min-height: 100vh;
}
.auth-context {
  background: var(--panel);
  border-right: 1px solid var(--hairline);
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.auth-form-side {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.auth-form {
  width: 100%;
  max-width: 360px;
}
.wordmark {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wordmark .logo-icon {
  height: 26px;
  width: auto;
  display: inline-block;
}
.auth-context h1 {
  font-size: 28px;
  line-height: 1.3;
  max-width: 22ch;
  font-weight: 600;
  margin: 0;
}
.auth-context .meta {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text-faint);
}

.auth-form h2 { margin: 0 0 6px; font-size: 20px; }
.auth-form p.sub { color: var(--text-dim); margin: 0 0 28px; font-size: 14px; }
.auth-error {
  background: rgba(226,104,91,0.1);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.switch-mode { margin-top: 20px; font-size: 13px; color: var(--text-dim); }
.switch-mode button { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; }

/* ── App shell ───────────────────────────────────────────────────── */
.app-shell {
  display: grid;
  grid-template-columns: 250px 1fr;
  height: 100vh;
}
.rail {
  background: var(--panel);
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

<script>// Populates the shared #project-list rail on every standalone page
// (My Tasks, Daily To-Do, Projects, Trackers, Sites, Calendar, Reports).
// Clicking a project navigates to its board on dashboard.html.
async function initShell(user) {
  const emailEl = document.getElementById("user-email");
  const nameEl = document.getElementById("profile-mini-name");
  const avatarEl = document.getElementById("profile-avatar-mini");
  const meta = user.user_metadata || {};
  const displayName = (meta.full_name || meta.name || user.email || "Profile").trim();
  const initials = displayName.split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join("").toUpperCase() || "VT";
  if (emailEl) emailEl.textContent = user.email || "";
  if (nameEl) nameEl.textContent = displayName;
  if (avatarEl) avatarEl.textContent = initials;

  const signoutBtn = document.getElementById("signout-btn");
  if (signoutBtn) {
    signoutBtn.addEventListener("click", async () => {
      await window.sb.auth.signOut();
      window.location.hash = "#login";
    });
  }

  const listEl = document.getElementById("project-list");
  if (!listEl) return;
  const { data, error } = await window.sb.from("projects").select("*").order("created_at");
  if (error) { console.error(error); return; }

    listEl.appendChild(row);
  });
}
</script>

  window.applyVisionTheme = function() {
    document.documentElement.setAttribute("data-theme", getStored());
    const btn = document.getElementById("theme-toggle-btn");
    if (btn) btn.textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙";
  };
  document.addEventListener("click", function(e) {
    const btn=e.target.closest("#theme-toggle-btn");
    if(!btn) return;
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme",next);
    try { localStorage.setItem("vt-theme",next); } catch(e) {}
    const b=document.getElementById("theme-toggle-btn"); if(b) b.textContent=next==="light"?"☀️":"🌙";
  });
  window.applyVisionTheme();
})();
</script>

const VT_TEMPLATES = {"index(2).html": "\n\n<div class=\"auth-wrap\">\n  <div class=\"auth-context\">\n    <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n      <div class=\"brand-lockup\"><img src=\"__FULL__\" alt=\"Vision Track\" class=\"login-logo\" /><div class=\"brand-caption\">PLAN&nbsp;&nbsp;|&nbsp;&nbsp;EXECUTE&nbsp;&nbsp;|&nbsp;&nbsp;TRACK&nbsp;&nbsp;|&nbsp;&nbsp;ACHIEVE</div></div>\n    </div>\n\n    <div>\n      <h1 id=\"auth-headline\">Track the work. See the whole operation.</h1>\n      <p class=\"meta\" style=\"margin-top:14px;\">Projects, tasks, CCTV sites and daily work in one workspace.</p>\n    </div>\n\n    \n  </div>\n\n  <div class=\"auth-form-side\">\n    <form class=\"auth-form\" id=\"auth-form\">\n      <h2 id=\"form-title\">Sign in</h2>\n      <p class=\"sub\" id=\"form-sub\">Enter your credentials to open your board.</p>\n\n      <div class=\"auth-error\" id=\"auth-error\"></div>\n\n      <div class=\"field\">\n        <label for=\"email\">Email</label>\n        <input id=\"email\" type=\"email\" required autocomplete=\"email\" />\n      </div>\n      <div class=\"field\">\n        <label for=\"password\">Password</label>\n        <input id=\"password\" type=\"password\" required autocomplete=\"current-password\" minlength=\"6\" />\n      </div>\n\n      <button type=\"submit\" class=\"primary\" style=\"width:100%;\" id=\"submit-btn\">Sign in</button>\n\n      <p class=\"switch-mode\">\n        <span id=\"switch-prompt\">No account yet?</span>\n        <button type=\"button\" id=\"switch-btn\">Create one</button>\n      </p>\n    </form>\n  </div>\n</div>\n\n\n\n\n", "dashboard.html": "\n\n<div class=\"app-shell\">\n  <aside class=\"rail\">\n    <div class=\"rail-header\">\n      <div class=\"wordmark\"><img src=\"__ICON__\" alt=\"Vision Track logo\" class=\"logo-icon\" /> Vision Track</div>\n    </div>\n    <div class=\"primary-nav\">\n      <div class=\"nav-section-label\">WORKSPACE</div>\n      <div class=\"nav-grid\">\n        <div class=\"rail-item\" id=\"nav-dashboard\"><span class=\"nav-icon\">⌂</span><span>Dashboard</span><span class=\"nav-key\">01</span></div>\n        <a href=\"#mytasks\" class=\"rail-item\"><span class=\"nav-icon\">✓</span><span>My Tasks</span><span class=\"nav-key\">02</span></a>\n        <a href=\"#todo\" class=\"rail-item\"><span class=\"nav-icon\">☑</span><span>Daily To-Do</span><span class=\"nav-key\">03</span></a>\n      </div>\n      <div class=\"nav-section-label\">OPERATIONS</div>\n      <div class=\"nav-grid\">\n        <a href=\"#projects\" class=\"rail-item\"><span class=\"nav-icon\">▦</span><span>Projects</span><span class=\"nav-key\">04</span></a>\n        <a href=\"#trackers\" class=\"rail-item\"><span class=\"nav-icon\">◉</span><span>CCTV Tracker</span><span class=\"nav-key\">05</span></a>\n        <a href=\"#sites\" class=\"rail-item\"><span class=\"nav-icon\">⌖</span><span>Sites</span><span class=\"nav-key\">06</span></a>\n      </div>\n      <div class=\"nav-section-label\">PLANNING &amp; INSIGHTS</div>\n      <div class=\"nav-grid\">\n        <a href=\"#calendar\" class=\"rail-item\"><span class=\"nav-icon\">▣</span><span>Calendar</span><span class=\"nav-key\">07</span></a>\n        <a href=\"#reports\" class=\"rail-item\"><span class=\"nav-icon\">▥</span><span>Reports</span><span class=\"nav-key\">08</span></a>\n      </div>\n    </div>\n    <div class=\"workspace-label\">PROJECTS</div>\n    <div class=\"rail-projects\" id=\"project-list\">\n      <!-- populated by app.js -->\n    </div>\n    <div style=\"padding: 10px 16px;\">\n      <button id=\"new-project-btn\" style=\"width:100%;\">+ New project</button>\n    </div>\n    <div class=\"rail-footer\">\n      <a href=\"#profile\" class=\"profile-mini\" id=\"profile-mini-link\">\n        <span class=\"profile-avatar\" id=\"profile-avatar-mini\">VT</span>\n        <span class=\"profile-mini-text\">\n          <span class=\"profile-mini-name\" id=\"profile-mini-name\">Profile</span>\n          <span class=\"profile-mini-email\" id=\"user-email\"></span>\n        </span>\n        <span style=\"color:var(--text-faint);\">›</span>\n      </a>\n      <button class=\"ghost\" id=\"signout-btn\">Sign out</button>\n    </div>\n  </aside>\n\n  <main class=\"main\">\n    <div class=\"topbar\">\n      <div>\n        <h1 id=\"project-title\">Select a project</h1>\n        <div class=\"project-meta\" id=\"project-meta\"></div>\n      </div>\n      <button class=\"primary\" id=\"new-task-btn\" disabled>+ New task</button>\n    </div>\n\n    <div class=\"overview hidden\" id=\"overview-view\">\n      <div class=\"stat-grid\">\n        <div class=\"stat-card\">\n          <span>Total tasks</span>\n          <div class=\"stat-value\" id=\"stat-total\">0</div>\n        </div>\n        <div class=\"stat-card\">\n          <span>Completed today</span>\n          <div class=\"stat-value\" id=\"stat-completed-today\">0</div>\n        </div>\n        <div class=\"stat-card\">\n          <span>Pending</span>\n          <div class=\"stat-value\" id=\"stat-pending\">0</div>\n        </div>\n        <div class=\"stat-card\">\n          <span>Overdue</span>\n          <div class=\"stat-value\" id=\"stat-overdue\">0</div>\n        </div>\n      </div>\n\n      <div class=\"chart-grid\">\n        <div class=\"chart-panel\">\n          <h3>Tasks by status</h3>\n          <div class=\"donut-wrap\">\n            <svg viewBox=\"0 0 120 120\" width=\"150\" height=\"150\" id=\"status-donut\"></svg>\n            <div class=\"donut-legend\" id=\"status-legend\"></div>\n          </div>\n        </div>\n        <div class=\"chart-panel\">\n          <h3>Tasks by priority</h3>\n          <div class=\"bar-chart\" id=\"priority-bars\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"board\" id=\"board\">\n      <div class=\"column\" data-status=\"backlog\">\n        <div class=\"column-header\"><span>Backlog</span><span class=\"count\" id=\"count-backlog const VT_SCRIPTS = {"index(2).html": "(function () {\n  const cfg = window.VISIONTRACK_CONFIG;\n  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);\n\n  let mode = \"signin\"; // or \"signup\"\n  const form = document.getElementById(\"auth-form\");\n  const errorBox = document.getElementById(\"auth-error\");\n  const submitBtn = document.getElementById(\"submit-btn\");\n  const switchBtn = document.getElementById(\"switch-btn\");\n  const switchPrompt = document.getElementById(\"switch-prompt\");\n  const formTitle = document.getElementById(\"form-title\");\n  const formSub = document.getElementById(\"form-sub\");\n\n  function showError(msg) {\n    errorBox.textContent = msg;\n    errorBox.style.display = \"block\";\n  }\n  function clearError() {\n    errorBox.style.display = \"none\";\n  }\n\n  switchBtn.addEventListener(\"click\", () => {\n    clearError();\n    mode = mode === \"signin\" ? \"signup\" : \"signin\";\n    if (mode === \"signup\") {\n      formTitle.textContent = \"Create an account\";\n      formSub.textContent = \"Set a password to start your board.\";\n      submitBtn.textContent = \"Create account\";\n      switchPrompt.textContent = \"Already have an account?\";\n      switchBtn.textContent = \"Sign in\";\n    } else {\n      formTitle.textContent = \"Sign in\";\n      formSub.textContent = \"Enter your credentials to open your board.\";\n      submitBtn.textContent = \"Sign in\";\n      switchPrompt.textContent = \"No account yet?\";\n      switchBtn.textContent = \"Create one\";\n    }\n  });\n\n  form.addEventListener(\"submit\", async (e) => {\n    e.preventDefault();\n    clearError();\n    submitBtn.disabled = true;\n    const email = document.getElementById(\"email\").value.trim();\n    const password = document.getElementById(\"password\").value;\n\n    try {\n      if (mode === \"signup\") {\n        const { error } = await supabase.auth.signUp({ email, password });\n        if (error) throw error;\n        showError(\"Account created. Check your email if confirmation is required, then sign in.\");\n        submitBtn.disabled = false;\n        return;\n      } else {\n        const { error } = await supabase.auth.signInWithPassword({ email, password });\n        if (error) throw error;\n        window.location.hash = \"#dashboard\";\n      }\n    } catch (err) {\n      showError(err.message || \"Something went wrong.\");\n      submitBtn.disabled = false;\n    }\n  });\n\n  // If already signed in, skip straight to the dashboard.\n  supabase.auth.getSession().then(({ data }) => {\n    if (data.session) window.location.hash = \"#dashboard\";\n  });\n})();", "dashboard.html": "(function () {\nconst cfg = window.VISIONTRACK_CONFIG;\nconst supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);\n\nlet currentUser = null;\nlet projects = [];\nlet activeProjectId = null;\nlet tasks = [];\nlet editingTaskId = null; // null = creating\nlet editingProjectId = null; // null = creating\nlet viewMode = \"overview\"; // \"overview\" | \"board\"\n\n// \u2500\u2500 Auth guard \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function guardAndInit() {\n  const { data } = await supabase.auth.getSession();\n  if (!data.session) {\n    window.location.hash = \"#login\";\n    return;\n  }\n  currentUser = data.session.user;\n  document.getElementById(\"user-email\").textContent = currentUser.email;\n\n  const hashParts = window.location.hash.replace(/^#/, \"\").split(\"?\");\n  const params = new URLSearchParams(hashParts[1] || \"\");\n  const deepProjectId = params.get(\"project\");\n  const deepTaskId = params.get(\"task\");\n  const wantsNewProject = params.get(\"new\") === \"project\";\n\n  if (deepProjectId) { viewMode = \"board\"; activeProjectId = deepProjectId; }\n  await loadProjects();\n\n  if (deepProjectId) {\n    await selectProject(deepProjectId);\n    if (deepTaskId) openTaskModal(deepTaskId);\n  }\n  if (wantsNewProject) openProjectModal(null);\n}\n\ndocument.getElementById(\"signout-btn\").addEventListener(\"click\", async () => {\n  await supabase.auth.signOut();\n  window.location.hash = \"#login\";\n});\n\n// \u2500\u2500 Projects \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nasync function loadProjects() {\n  const { data, error } = await supabase\n    .from(\"projects\")\n    .select(\"*\")\n    .order(\"created_at\", { ascending: true });\n  if (error) { console.error(error); return; }\n  projects = data || [];\n  renderProjectList();\n  if (viewMode === \"overview\") {\n    await showOverview();\n  } else if (!activeProjectId && projects.length) {\n    selectProject(projects[0].id);\n  } else if (!projects.length) {\n    document.getElementById(\"new-task-btn\").disabled = true;\n  }\n}\n\nfunction renderProjectList() {\n  const dashNav = document.getElementById(\"nav-dashboard\");\n  dashNav.classList.toggle(\"active\", viewMode === \"overview\");\n  const el = document.getElementById(\"project-list\");\n  el.innerHTML = \"\";\n  projects.forEach((p) => {\n    const row = document.createElement(\"div\");\n    row.className = \"rail-item\" + (p.id === activeProjectId ? \" active\" : \"\");\n    row.innerHTML = `<span>${escapeHtml(p.name)}</span><span class=\"count\">${statusAbbrev(p.status)}</span>`;\n    row.addEventListener(\"click\", () => selectProject(p.id));\n    el.appendChild(row);\n  });\n}\n\nfunction statusAbbrev(s) {\n  return "; return; }\n    closeModal();\n    await loadSites();\n  });\n\n  document.getElementById(\"site-delete-btn\").addEventListener(\"click\", async () => {\n    if (!editingId || !confirm(\"Delete this site?\")) return;\n    await window.sb.from(\"sites\").delete().eq(\"id\", editingId);\n    closeModal();\n    await loadSites();\n  });\n\n  await loadSites();\n})();", "calendar.html": "(async function () {\n  const user = await window.requireUser();\n  if (!user) return;\n  await initShell(user);\n\n  let viewDate = new Date();\n  let allTasks = [];\n\n  const { data, error } = await window.sb\n    .from(\"tasks\")\n    .select(\"id, title, due_date, status, project_id\")\n    .not(\"due_date\", \"is\", null);\n  if (error) console.error(error);\n  allTasks = data || [];\n\n  function dateKey(y, m, d) {\n    return `${y}-${String(m + 1).padStart(2, \"0\")}-${String(d).padStart(2, \"0\")}`;\n  }\n\n  function render() {\n    const y = viewDate.getFullYear();\n    const m = viewDate.getMonth();\n    document.getElementById(\"month-label\").textContent = viewDate.toLocaleDateString(undefined, { month: \"long\", year: \"numeric\" });\n\n    const grid = document.getElementById(\"cal-grid\");\n    grid.innerHTML = \"\";\n    [\"Sun\",\"Mon\",\"Tue\",\"Wed\",\"Thu\",\"Fri\",\"Sat\"].forEach((d) => {\n      const el = document.createElement(\"div\");\n      el.className = \"cal-dow\";\n      el.textContent = d;\n      grid.appendChild(el);\n    });\n\n    const firstOfMonth = new Date(y, m, 1);\n    const startOffset = firstOfMonth.getDay();\n    const gridStart = new Date(y, m, 1 - startOffset);\n    const today = new Date().toISOString().slice(0, 10);\n\n    for (let i = 0; i < 42; i++) {\n      const cellDate = new Date(gridStart);\n      cellDate.setDate(gridStart.getDate() + i);\n      const key = dateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());\n      const isOtherMonth = cellDate.getMonth() !== m;\n      const isToday = key === today;\n\n      const cell = document.createElement(\"div\");\n      cell.className = \"cal-cell\" + (isOtherMonth ? \" other-month\" : \"\") + (isToday ? \" today\" : \"\");\n      const dayNum = document.createElement(\"div\");\n      dayNum.className = \"daynum\";\n      dayNum.textContent = cellDate.getDate();\n      cell.appendChild(dayNum);\n\n      allTasks.filter((t) => t.due_date === key).forEach((t) => {\n        const pill = document.createElement(\"div\");\n        const isOverdue = t.due_date < today && t.status !== \"done\";\n        pill.className = \"cal-task-pill\" + (isOverdue ? \" overdue\" : \"\");\n        pill.textContent = t.title;\n        pill.addEventListener(\"click\", () => {\n          window.location.hash = `#dashboard?project=${t.project_id}&task=${t.id}`;\n        });\n        cell.appendChild(pill);\n      });\n\n      grid.appendChild(cell);\n    }\n  }\n\n  document.getElementById(\"prev-month\").addEventListener(\"click\", () => {\n    viewDate.setMonth(viewDate.getMonth() - 1);\n    render();\n  });\n  document.getElementById(\"next-month\").addEventListener(\"click\", () => {\n    viewDate.setMonth(viewDate.getMonth() + 1);\n    render();\n  });\n  document.getElementById(\"today-month-btn\").addEventListener(\"click\", () => {\n    viewDate = new Date();\n    render();\n  });\n\n  render();\n})();", "reports.html": "(async function () {\n  const user = await window.requireUser();\n  if (!user) return;\n  await initShell(user);\n\n  const [{ data: projects, error: pErr }, { data: tasks, error: tErr }, { data: updates, error: uErr }] = await Promise.all([\n    window.sb.from(\"projects\").select(\"*\").order(\"created_at\"),\n    window.sb.from(\"tasks\").select(\"*\").order(\"created_at\"),\n    window.sb.from(\"updates\").select(\"*\").order(\"created_at\", { ascending: false }),\n  ]);\n  if (pErr) console.error(pErr);\n  if (tErr) console.error(tErr);\n  if (uErr) console.error(uErr);\n\n  const today = new Date().toISOString().slice(0, 10);\n  const body = document.getElementById(\"report-rows\");\n  const auditEl = document.getElementById(\"audit-trail\");\n  body.innerHTML = \"\";\n  auditEl.innerHTML = \"\";\n\n  if (!projects || !projects.length) {\n    body.innerHTML = '<tr><td colspan=\"7\" style=\"text-align:center; color:var(--text-faint);\">No projects yet.</td></tr>';\n    auditEl.innerHTML = '<div class=\"empty-state\">No projects yet.</div>';\n    return;\n  }\n\n  function delayInfo(t) {\n    if (!t.due_date) return \"No due date\";\n    const due = new Date(t.due_date);\n    if (t.status === \"done\") {\n      if (!t.completed_at) return \"Done\";\n      const completedDate = new Date(t.completed_at.slice(0, 10));\n      const diffDays = Math.round((completedDate - due) / 86400000);\n      return diffDays > 0 ? `\u26a0 Completed ${diffDays}d late` : \"On time\";\n    }\n    const diffDays = Math.round((new Date(today) - due) / 86400000);\n    return diffDays > 0 ? `\u26a0 ${diffDays}d overdue` : \"On track\";\n  }\n\n  projects.forEach((p) => {\n    const pt = (tasks || []).filter((t) => t.project_id === p.id);\n    const total = pt.length;\n    const backlog = pt.filter((t) => t.status === \"backlog\").length;\n    const inProgress = pt.filter((t) => t.status === \"in_progress\").length;\n    const done = pt.filter((t) => t.status === \"done\").length;\n    const overdue = pt.filter((t) => t.due_date && t.due_date < today && t.status !== \"done\").length;\n    const pct = total ? Math.round((done / total) * 100) : 0;\n\n    // Overview row\n    const tr = document.createElement(\"tr\");\n    tr.style.cursor = \"pointer\";\n    tr.innerHTML = `\n      <td>${window.escapeHtmlShared(p.name)}</td>\n      <td>${total}</td>\n      <td>${backlog}</td>\n      <td>${inProgress}</td>\n      <td>${done}</td>\n      <td style=\"${overdue ? \"color:var(--danger);\" : \"\"}\">${overdue}</td>\n      <td>\n        <div style=\"display:flex; align-items:center; gap:8px;\">\n          <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:${pct}%;\"></div></div>\n          <span style=\"font-family:var(--mono); font-size:12px; color:var(--text-dim);\">${pct}%</span>\n        </div>\n      </td>\n    `;\n    tr.addEventListener(\"click\", () => { window.location.hash = `#dashboard?project=${p.id}`; });\n    body.appendChild(tr);\n\n    // Audit trail entry\n    const projectUpdates = (updates || []).filter((u) => u.project_id === p.id);\n    const createdDate = new Date(p.created_at).toLocaleDateString(undefined, { year: \"numeric\", month: \"short\", day: \"numeric\" });\n\n    const details = document.createElement(\"details\");\n    details.className = \"audit-project\";\n    const tasksHtml = pt.length\n      ? pt.map((t) => {\n          const taskUpdates = (updates || []).filter((u) => u.task_id === t.id);\n          const delay = delayInfo(t);\n          const isFlagged = delay.startsWith(\"\u26a0\");\n          return `\n            <div class=\"audit-task\">\n              <div class=\"head\">\n                <span class=\"title\">${window.escapeHtmlShared(t.title)}</span>\n                <span class=\"right\">\n                  <span class=\"priority-pill ${t.priority}\">${t.priority}</span>\n                  <span>${t.status.replace(\"_\", \" \")}</span>\n                  <span>${t.due_date ? \"Due \" + t.due_date : \"No due date\"}</span>\n                  <span class=\"${isFlagged ? \"delay-flag\" : \"\"}\">${delay}</span>\n                </span>\n              </div>\n              ${taskUpdates.length ? `\n                <div class=\"updates\">\n                  ${taskUpdates.map((u) => `<div class=\"u\"><span class=\"when\">${new Date(u.created_at).toLocaleDateString(undefined, { month: \"short\", day: \"numeric\" })}</span>${window.escapeHtmlShared(u.note)}</div>`).join(\"\")}\n                </div>\n              ` : \"\"}\n            </div>\n          `;\n        }).join(\"\")\n      : '<div style=\"color:var(--text-faint); font-size:13px; padding:10px 0;\">No tasks added yet.</div>';\n\n    const projectUpdatesHtml = projectUpdates.length\n      ? `<div class=\"audit-project-updates\">\n          <div class=\"label\">Project-level updates</div>\n          ${projectUpdates.map((u) => `<div class=\"u\"><span class=\"when\">${new Date(u.created_at).toLocaleDateString(undefined, { month: \"short\", day: \"numeric\" })}</span>${window.escapeHtmlShared(u.note)}</div>`).join(\"\")}\n        </div>`\n      : \"\";\n\n    details.innerHTML = `\n      <summary>\n        <span>${window.escapeHtmlShared(p.name)}</span>\n        <span class=\"meta\">created ${createdDate} \u00b7 ${p.status.replace(\"_\", \" \")} \u00b7 ${total} task${total === 1 ? \"\" : \"s\"}</span>\n      </summary>\n      <div class=\"body\">\n        ${tasksHtml}\n        ${projectUpdatesHtml}\n      </div>\n    `;\n    auditEl.appendChild(details);\n  });\n})();"


, "profile.html": "(async function () {\n  const user = await window.requireUser();\n  if (!user) return;\n  await initShell(user);\n\n  const meta = user.user_metadata || {};\n  const nameInput = document.getElementById(\"profile-name\");\n  const designationInput = document.getElementById(\"profile-designation\");\n  const phoneInput = document.getElementById(\"profile-phone\");\n  const emailInput = document.getElementById(\"profile-email\");\n  const emailDisplay = document.getElementById(\"profile-email-display\");\n  const heading = document.getElementById(\"profile-display-heading\");\n  const avatar = document.getElementById(\"profile-avatar-lg\");\n  const success = document.getElementById(\"profile-success\");\n  const error = document.getElementById(\"profile-error\");\n\n  function initials(name) { return (name || user.email || \"VT\").split(/\\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join(\"\").toUpperCase() || \"VT\"; }\n  function show(box, msg) { box.textContent = msg; box.style.display = msg ? \"block\" : \"none\"; }\n  function syncProfile() {\n    const name = (nameInput.value || user.email || \"Your Profile\").trim();\n    heading.textContent = name || \"Your Profile\";\n    avatar.textContent = initials(name);\n    emailDisplay.textContent = user.email || \"\";\n  }\n\n  nameInput.value = meta.full_name || meta.name || \"\";\n  designationInput.value = meta.designation || \"\";\n  phoneInput.value = meta.phone || \"\";\n  emailInput.value = user.email || \"\";\n  syncProfile();\n  nameInput.addEventListener(\"input\", syncProfile);\n\n  document.getElementById(\"profile-save-btn\").addEventListener(\"click\", async () => {\n    show(error, \"\"); show(success, \"\");\n    const { error: updateError } = await window.sb.auth.updateUser({ data: {\n      full_name: nameInput.value.trim(),\n      designation: designationInput.value.trim(),\n      phone: phoneInput.value.trim()\n    }});\n    if (updateError) { show(error, updateError.message); return; }\n    show(success, \"Profile updated successfully.\");\n    const fresh = await window.sb.auth.getUser();\n    if (fresh.data && fresh.data.user) { Object.assign(user, fresh.data.user); }\n    syncProfile();\n    const miniName = document.getElementById(\"profile-mini-name\");\n    const miniAvatar = document.getElementById(\"profile-avatar-mini\");\n    if (miniName) miniName.textContent = nameInput.value.trim() || user.email || \"Profile\";\n    if (miniAvatar) miniAvatar.textContent = initials(nameInput.value.trim());\n  });\n\n  document.getElementById(\"password-save-btn\").addEventListener(\"click\", async () => {\n    show(document.getElementById(\"password-error\"), \"\"); show(document.getElementById(\"password-success\"), \"\");\n    const password = document.getElementById(\"new-password\").value;\n    const confirm = document.getElementById(\"confirm-password\").value;\n    if (password.length < 6) { show(document.getElementById(\"password-error\"), \"Password must be at least 6 characters.\"); return; }\n    if (password !== confirm) { show(document.getElementById(\"password-error\"), \"Passwords do not match.\"); return; }\n    const { error: passError } = await window.sb.auth.updateUser({ password });\n    if (passError) { show(document.getElementById(\"password-error\"), passError.message); return; }\n    document.getElementById(\"new-password\").value = \"\"; document.getElementById(\"confirm-password\").value = \"\";\n    show(document.getElementById(\"password-success\"), \"Password updated successfully.\");\n  });\n})();"};
const VT_ROUTES = {"login": "index(2).html", "dashboard": "dashboard.html", "mytasks": "mytasks.html", "todo": "todo.html", "projects": "projects.html", "trackers": "trackers.html", "sites": "sites.html", "calendar": "calendar.html", "reports": "reports.html", "profile": "profile.html"};
function vtParseRoute(){
  const raw=(location.hash||"#login").slice(1), q=raw.indexOf("?");
  return {name:(q>=0?raw.slice(0,q):raw)||"login",query:q>=0?raw.slice(q+1):""};
}
function vtNormalizeNav(root){
  root.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href')||"";
    if(href.endsWith(".html")) a.setAttribute("href","#"+href.replace(".html","").replace("index(2)","login"));
  });
}
async function vtLoadRoute(){
  const {name}=vtParseRoute(), file=VT_ROUTES[name]||VT_ROUTES.login;
  document.getElementById("spa-error").style.display="none";
  const app=document.getElementById("vt-app");
  app.innerHTML=VT_TEMPLATES[file].replaceAll("__ICON__",VT_ASSETS.icon).replaceAll("__FULL__",VT_ASSETS.full).replaceAll("__FAVICON__",VT_ASSETS.favicon);
  vtNormalizeNav(app);
  app.querySelectorAll(".primary-nav a.rail-item").forEach(function(a){
    const href=a.getAttribute("href")||"";
    a.classList.toggle("active", href==="#"+name);
  });
  window.applyVisionTheme();
  const code=VT_SCRIPTS[file];
  if(code){
    try {
      const result=new Function(code)();
      if(result && typeof result.then==="function") await result;
    } catch(err) {
      console.error("Vision Track page error:",err);
      const el=document.getElementById("spa-error");
      el.textContent="Page error: "+(err.message||String(err)); el.style.display="block";
    }
  }
}
window.addEventListener("hashchange",vtLoadRoute);
window.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const map={"1":"#dashboard","2":"#mytasks","3":"#todo","4":"#projects","5":"#trackers","6":"#sites","7":"#calendar","8":"#reports"};
  if(map[e.key]){ e.preventDefault(); location.hash=map[e.key]; }
});
window.addEventListener("DOMContentLoaded",vtLoadRoute);
</script>
