<!doctype html>
<html lang="en">
<head>
<script src="theme.js"></script>
<meta charset="utf-8" />
<title>Vision Track — My Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="rail">
    <div class="rail-header">
      <div class="wordmark"><img src="assets/logo-icon.png" alt="Vision Track logo" class="logo-icon" /> Vision Track</div>
    </div>
    <div style="padding: 10px 8px 0;">
      <a href="dashboard.html" class="rail-item"><span>Dashboard</span></a>
      <a href="mytasks.html" class="rail-item active"><span>My Tasks</span></a>
      <a href="todo.html" class="rail-item"><span>Daily To-Do</span></a>
      <a href="projects.html" class="rail-item"><span>Projects</span></a>
      <a href="trackers.html" class="rail-item"><span>Project Trackers</span></a>
      <a href="sites.html" class="rail-item"><span>Sites</span></a>
      <a href="calendar.html" class="rail-item"><span>Calendar</span></a>
      <a href="reports.html" class="rail-item"><span>Reports</span></a>
    </div>
    <div style="padding: 14px 16px 4px; font-size:12px; color: var(--text-faint);">Workspace</div>
    <div class="rail-projects" id="project-list"></div>
    <div style="padding: 10px 16px;">
      <a href="dashboard.html?new=project" style="display:block;"><button style="width:100%;">+ New project</button></a>
    </div>
    <div class="rail-footer">
      <span id="user-email" style="font-family: var(--mono); font-size:12px; color: var(--text-faint);"></span>
      <button class="ghost" id="theme-toggle-btn" title="Toggle theme">🌙</button>
      <button class="ghost" id="signout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-wrap">
      <div class="page-header">
        <div>
          <h1>My Tasks</h1>
          <p>Every task across every project, searchable and filterable.</p>
        </div>
        <button class="primary" id="new-task-open-btn">+ New task</button>
      </div>

      <div class="filters-row">
        <input type="text" id="search-input" placeholder="Search by title or detail..." />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="backlog">Backlog</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <select id="priority-filter">
          <option value="">All priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="task-list" id="task-list"></div>
    </div>
  </main>
</div>

<div class="modal-backdrop hidden" id="task-modal-backdrop">
  <div class="modal">
    <h3>New task</h3>
    <div class="auth-error" id="task-error"></div>
    <div class="field">
      <label for="qt-project">Project</label>
      <select id="qt-project"></select>
    </div>
    <div class="field">
      <label for="qt-title">Title</label>
      <input id="qt-title" type="text" placeholder="e.g. Migrate DNS records" />
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field">
        <label for="qt-priority">Priority</label>
        <select id="qt-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field">
        <label for="qt-due">Due date (optional)</label>
        <input id="qt-due" type="date" />
      </div>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right">
        <button class="ghost" id="task-cancel-btn">Cancel</button>
        <button class="primary" id="task-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="client.js"></script>
<script src="shell.js"></script>
<script>
(async function () {
  const user = await window.requireUser();
  if (!user) return;
  await initShell(user);

  let allTasks = [];
  let projectOptions = [];

  async function loadProjectOptions() {
    const { data, error } = await window.sb.from("projects").select("id, name").order("name");
    if (error) { console.error(error); return; }
    projectOptions = data || [];
    const sel = document.getElementById("qt-project");
    sel.innerHTML = projectOptions.length
      ? projectOptions.map((p) => `<option value="${p.id}">${window.escapeHtmlShared(p.name)}</option>`).join("")
      : '<option value="">No projects yet</option>';
  }

  function openTaskModal() {
    document.getElementById("task-error").style.display = "none";
    document.getElementById("qt-title").value = "";
    document.getElementById("qt-priority").value = "medium";
    document.getElementById("qt-due").value = "";
    document.getElementById("task-modal-backdrop").classList.remove("hidden");
  }
  function closeTaskModal() {
    document.getElementById("task-modal-backdrop").classList.add("hidden");
  }

  document.getElementById("new-task-open-btn").addEventListener("click", openTaskModal);
  document.getElementById("task-cancel-btn").addEventListener("click", closeTaskModal);

  document.getElementById("task-save-btn").addEventListener("click", async () => {
    const project_id = document.getElementById("qt-project").value;
    const title = document.getElementById("qt-title").value.trim();
    const priority = document.getElementById("qt-priority").value;
    const due_date = document.getElementById("qt-due").value || null;
    const errBox = document.getElementById("task-error");

    if (!project_id) { errBox.textContent = "Create a project first — tasks need to belong to one."; errBox.style.display = "block"; return; }
    if (!title) { errBox.textContent = "Give the task a title."; errBox.style.display = "block"; return; }

    const { error } = await window.sb.from("tasks").insert({
      project_id, title, priority, due_date,
      status: "backlog",
      owner_id: user.id,
    });
    if (error) { errBox.textContent = error.message; errBox.style.display = "block"; return; }
    closeTaskModal();
    await loadTasks();
  });

  async function loadTasks() {
    const { data, error } = await window.sb
      .from("tasks")
      .select("*, projects(name)")
      .order("created_at", { ascending: false });
    if (error) { console.error(error); return; }
    allTasks = data || [];
    render();
  }

  function render() {
    const q = document.getElementById("search-input").value.trim().toLowerCase();
    const statusF = document.getElementById("status-filter").value;
    const priorityF = document.getElementById("priority-filter").value;
    const today = new Date().toISOString().slice(0, 10);

    const filtered = allTasks.filter((t) => {
      if (statusF && t.status !== statusF) return false;
      if (priorityF && t.priority !== priorityF) return false;
      if (q && !(t.title.toLowerCase().includes(q) || (t.detail || "").toLowerCase().includes(q))) return false;
      return true;
    });

    const listEl = document.getElementById("task-list");
    listEl.innerHTML = "";
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-state">No tasks match.</div>';
      return;
    }

    filtered.forEach((t) => {
      const isOverdue = t.due_date && t.due_date < today && t.status !== "done";
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <div class="main">
          <div class="title-line">
            <span class="title" style="cursor:pointer;">${window.escapeHtmlShared(t.title)}</span>
            <span class="priority-pill ${t.priority}">${t.priority}</span>
          </div>
          <div class="meta-line">
            ${t.projects ? `<span>${window.escapeHtmlShared(t.projects.name)}</span>` : ""}
            ${t.due_date ? `<span class="${isOverdue ? "overdue-flag" : ""}">Due ${t.due_date}</span>` : ""}
          </div>
        </div>
        <div class="actions">
          <select class="status-select">
            <option value="backlog" ${t.status === "backlog" ? "selected" : ""}>Backlog</option>
            <option value="in_progress" ${t.status === "in_progress" ? "selected" : ""}>In progress</option>
            <option value="done" ${t.status === "done" ? "selected" : ""}>Done</option>
          </select>
        </div>
      `;
      row.querySelector(".title").addEventListener("click", () => {
        window.location.href = `dashboard.html?project=${t.project_id}&task=${t.id}`;
      });
      row.querySelector(".status-select").addEventListener("change", async (e) => {
        const newStatus = e.target.value;
        const payload = { status: newStatus };
        payload.completed_at = newStatus === "done" ? (t.completed_at || new Date().toISOString()) : null;
        const { error } = await window.sb.from("tasks").update(payload).eq("id", t.id);
        if (error) { alert(error.message); return; }
        await loadTasks();
      });
      listEl.appendChild(row);
    });
  }

  document.getElementById("search-input").addEventListener("input", render);
  document.getElementById("status-filter").addEventListener("change", render);
  document.getElementById("priority-filter").addEventListener("change", render);

  await loadProjectOptions();
  await loadTasks();
})();
</script>
</body>
</html>
